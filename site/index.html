<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="zynx — AI Agents & Automation for Business" data-he="zynx — סוכני AI ואוטומציה לעסקים">zynx</title>
  <meta name="description"
        data-en="zynx builds AI agents, automations, and marketing campaigns that run your business on autopilot."
        data-he="zynx בונה סוכני AI, אוטומציות וקמפיינים שיווקיים שמריצים את העסק שלך על טייס אוטומטי."
        content="zynx — AI agents, automations and marketing for business." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow glow-1" aria-hidden="true"></div>
  <div class="bg-glow glow-2" aria-hidden="true"></div>

  <!-- NAV -->
  <header class="nav">
    <a href="#top" class="logo">zynx<span class="logo-dot">.</span></a>
    <nav class="nav-links">
      <a href="#services" data-en="Services" data-he="שירותים"></a>
      <a href="#process" data-en="How it works" data-he="איך זה עובד"></a>
      <a href="#why" data-en="Why zynx" data-he="למה zynx"></a>
      <a href="#contact" data-en="Contact" data-he="צור קשר"></a>
    </nav>
    <div class="nav-actions">
      <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">
        <span class="lang-en">EN</span><span class="lang-sep">/</span><span class="lang-he">עב</span>
      </button>
      <a href="#contact" class="btn btn-primary btn-sm" data-en="Get started" data-he="בואו נתחיל"></a>
    </div>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <div class="badge">
        <span class="badge-dot"></span>
        <span data-en="AI agents · automation · marketing" data-he="סוכני AI · אוטומציה · שיווק"></span>
      </div>
      <h1 class="hero-title">
        <span data-en="Put your business" data-he="תנו לעסק שלכם"></span>
        <span class="gradient-text" data-en="on autopilot." data-he="לעבוד על טייס אוטומטי."></span>
      </h1>
      <p class="hero-sub"
         data-en="zynx designs and builds AI agents, automations, and marketing campaigns — so the repetitive work runs itself and your team focuses on growth."
         data-he="zynx מתכננת ובונה סוכני AI, אוטומציות וקמפיינים שיווקיים — כך שהעבודה החוזרת רצה לבד והצוות שלכם מתמקד בצמיחה."></p>
      <div class="hero-cta">
        <a href="#contact" class="btn btn-primary" data-en="Book a free consult" data-he="לשיחת ייעוץ חינם"></a>
        <a href="#services" class="btn btn-ghost" data-en="Explore services" data-he="לשירותים שלנו"></a>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-num">24/7</span><span class="stat-label" data-en="agents working" data-he="סוכנים פעילים"></span></div>
        <div class="stat"><span class="stat-num">10×</span><span class="stat-label" data-en="faster ops" data-he="תפעול מהיר יותר"></span></div>
        <div class="stat"><span class="stat-num">∞</span><span class="stat-label" data-en="scale, no extra headcount" data-he="סקייל בלי גיוס נוסף"></span></div>
      </div>
    </section>

    <!-- SERVICES -->
    <section id="services" class="section">
      <div class="section-head">
        <span class="eyebrow" data-en="What we do" data-he="מה אנחנו עושים"></span>
        <h2 data-en="Three ways zynx grows your business" data-he="שלוש דרכים שבהן zynx מצמיחה את העסק"></h2>
      </div>
      <div class="cards">
        <article class="card">
          <div class="card-icon">🤖</div>
          <h3 data-en="AI Agents" data-he="סוכני AI"></h3>
          <p data-en="Custom AI agents that handle support, sales, research, and back-office tasks — trained on your business and working around the clock."
             data-he="סוכני AI מותאמים אישית שמטפלים בתמיכה, מכירות, מחקר ומשימות בק-אופיס — מאומנים על העסק שלכם ופעילים מסביב לשעון."></p>
        </article>
        <article class="card card-featured">
          <div class="card-icon">⚙️</div>
          <h3 data-en="Automations" data-he="אוטומציות"></h3>
          <p data-en="End-to-end workflows that connect your tools — CRM, email, data, payments — so processes run without manual handoffs or copy-paste."
             data-he="תהליכים מקצה לקצה שמחברים את הכלים שלכם — CRM, מייל, דאטה, תשלומים — כך שהכל רץ בלי העברות ידניות או העתק-הדבק."></p>
        </article>
        <article class="card">
          <div class="card-icon">📈</div>
          <h3 data-en="Campaigns & Marketing" data-he="קמפיינים ושיווק"></h3>
          <p data-en="AI-powered campaigns: content, ads, and outreach that target the right audience and optimize themselves on the numbers that matter."
             data-he="קמפיינים מבוססי AI: תוכן, מודעות ופנייה יזומה שמכוונים לקהל הנכון ומתבצעת להם אופטימיזציה לפי המספרים שחשובים."></p>
        </article>
      </div>
    </section>

    <!-- PROCESS -->
    <section id="process" class="section">
      <div class="section-head">
        <span class="eyebrow" data-en="How it works" data-he="איך זה עובד"></span>
        <h2 data-en="From idea to running system" data-he="מרעיון למערכת שעובדת"></h2>
      </div>
      <div class="steps">
        <div class="step">
          <span class="step-num">01</span>
          <h3 data-en="Discover" data-he="אבחון"></h3>
          <p data-en="We map your processes and find where AI and automation create the biggest wins."
             data-he="ממפים את התהליכים שלכם ומאתרים איפה AI ואוטומציה ייצרו את ההשפעה הגדולה ביותר."></p>
        </div>
        <div class="step">
          <span class="step-num">02</span>
          <h3 data-en="Build" data-he="בנייה"></h3>
          <p data-en="We design and build the agents, automations, and campaigns — tailored to your stack."
             data-he="מתכננים ובונים את הסוכנים, האוטומציות והקמפיינים — מותאמים למערכות שלכם."></p>
        </div>
        <div class="step">
          <span class="step-num">03</span>
          <h3 data-en="Launch" data-he="השקה"></h3>
          <p data-en="We deploy, test, and integrate everything safely into your day-to-day."
             data-he="מטמיעים, בודקים ומשלבים הכל בבטחה בתוך השוטף שלכם."></p>
        </div>
        <div class="step">
          <span class="step-num">04</span>
          <h3 data-en="Optimize" data-he="אופטימיזציה"></h3>
          <p data-en="We monitor results and keep improving — your system gets smarter over time."
             data-he="עוקבים אחרי התוצאות וממשיכים לשפר — המערכת נעשית חכמה יותר עם הזמן."></p>
        </div>
      </div>
    </section>

    <!-- WHY -->
    <section id="why" class="section">
      <div class="section-head">
        <span class="eyebrow" data-en="Why zynx" data-he="למה zynx"></span>
        <h2 data-en="Built to actually ship" data-he="בנויים כדי להוציא לפועל"></h2>
      </div>
      <div class="features">
        <div class="feature">
          <h3 data-en="Fast to value" data-he="ערך מהיר"></h3>
          <p data-en="First automations live in weeks, not months." data-he="האוטומציות הראשונות עולות לאוויר תוך שבועות, לא חודשים."></p>
        </div>
        <div class="feature">
          <h3 data-en="Tailored, not templated" data-he="מותאם, לא תבניתי"></h3>
          <p data-en="Everything is built around your business — no generic bots." data-he="הכל נבנה סביב העסק שלכם — בלי בוטים גנריים."></p>
        </div>
        <div class="feature">
          <h3 data-en="You stay in control" data-he="השליטה נשארת אצלכם"></h3>
          <p data-en="Transparent systems with human approval where it matters." data-he="מערכות שקופות עם אישור אנושי במקומות שחשובים."></p>
        </div>
        <div class="feature">
          <h3 data-en="Scales with you" data-he="גדל יחד אתכם"></h3>
          <p data-en="Add capacity without adding headcount." data-he="מוסיפים קיבולת בלי להוסיף עובדים."></p>
        </div>
      </div>
    </section>

    <!-- CONTACT / CTA -->
    <section id="contact" class="cta">
      <div class="cta-inner">
        <h2 data-en="Let's automate your business" data-he="בואו נאוטמט את העסק שלכם"></h2>
        <p data-en="Tell us what's slowing you down. We'll show you what zynx can take off your plate."
           data-he="ספרו לנו מה מעכב אתכם, ונראה לכם מה zynx יכולה לקחת מהשולחן שלכם."></p>
        <form class="cta-form" onsubmit="return false;">
          <input type="text" required data-ph-en="Your name" data-ph-he="השם שלכם" placeholder="" />
          <input type="email" required data-ph-en="Email" data-ph-he="אימייל" placeholder="" />
          <button type="submit" class="btn btn-primary" data-en="Send" data-he="שליחה"></button>
        </form>
        <p class="cta-note" data-en="Or email us at hello@zynx.ai" data-he="או שלחו לנו מייל ל-hello@zynx.ai"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span class="logo">zynx<span class="logo-dot">.</span></span>
    <span class="footer-tag" data-en="AI agents · automation · marketing" data-he="סוכני AI · אוטומציה · שיווק"></span>
    <span class="footer-copy">© 2026 zynx</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
