<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYNX — תצוגת לוגו</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap');
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#08080c; color:#f4f4f8; font-family:"Segoe UI","Heebo",Arial,sans-serif;
        min-height:100vh; padding:50px 20px; }
  h1{ text-align:center; font-size:24px; margin-bottom:8px; }
  .sub{ text-align:center; color:#9a9ab0; font-size:14px; margin-bottom:46px; }
  .row{ display:flex; flex-wrap:wrap; gap:34px; justify-content:center; align-items:center; max-width:1100px; margin:0 auto 40px; }
  .panel{ background:#101018; border:1px solid #242436; border-radius:20px; padding:40px; text-align:center; }
  .panel .lbl{ color:#7aa6ff; font-size:13px; margin-top:18px; letter-spacing:1px; }

  .grad{ fill:url(#g); }
  /* lockup wordmark */
  .word{ font-family:'Chakra Petch','Segoe UI',sans-serif; font-weight:700; font-size:96px;
         letter-spacing:14px; color:#fff; line-height:1; }
</style>
</head>
<body>
  <h1>ZYNX — שחזור וקטורי של הלוגו</h1>
  <p class="sub">המארק + הלוקאפ + אווטאר. גרדיאנט כחול→סגול על שחור. אם זווית/עקומה לא מדויקת — תגיד ואכוונן.</p>

  <!-- shared gradient def -->
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="g" x1="0.2" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DA1FF"/><stop offset="0.5" stop-color="#5B6FF2"/><stop offset="1" stop-color="#8A46F0"/>
    </linearGradient>
  </defs></svg>

  <!-- Full lockup -->
  <div class="row">
    <div class="panel" style="background:#000">
      <svg width="560" height="180" viewBox="0 0 780 250">
        <path class="grad" d="M34,24 L188,24 L188,70 L96,180 L170,180 L186,226 L32,226 L32,180 L124,70 L52,70 Z"/>
        <text x="270" y="172" class="word" font-size="150" fill="#fff" font-family="'Chakra Petch','Segoe UI',sans-serif" font-weight="700" letter-spacing="14">ZYNX</text>
      </svg>
      <div class="lbl">לוקאפ מלא — לאתר ומצגת</div>
    </div>
  </div>

  <!-- Mark + Avatar -->
  <div class="row">
    <div class="panel" style="background:#000">
      <svg width="170" height="190" viewBox="0 0 220 250">
        <path class="grad" d="M34,24 L188,24 L188,70 L96,180 L170,180 L186,226 L32,226 L32,180 L124,70 L52,70 Z"/>
      </svg>
      <div class="lbl">המארק (סימן Z)</div>
    </div>

    <div class="panel">
      <svg width="180" height="180" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="#08080C"/>
        <g transform="translate(256,256) scale(1.55) translate(-110,-125)">
          <path class="grad" d="M34,24 L188,24 L188,70 L96,180 L170,180 L186,226 L32,226 L32,180 L124,70 L52,70 Z"/>
        </g>
      </svg>
      <div class="lbl">אווטאר אינסטגרם / וואטסאפ</div>
    </div>
  </div>

</body>
</html>
