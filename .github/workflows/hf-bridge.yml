name: hf-bridge
# גשר בין הריפו הזה לריפו האתר ב-Higgsfield (הרשת של סביבת ה-agent חסומה לשם).
# רץ על כל push לענף העבודה ומחליט לבד:
#   - אם landing-pages/id-cosmetics/hf-app לא קיים  -> PULL: משכפל את תבנית האתר לכאן
#   - אם קיים הקובץ hf-app/.push-me                -> PUSH: דוחף את hf-app לריפו של Higgsfield
#   - אחרת                                          -> לא עושה כלום
# המפתח למטה מוגבל לריפו האתר id-cosmetics בלבד, ונשמר כאן באישור מפורש של בעל הריפו.
on:
  push:
    branches: [claude/cosmetics-landing-page-pav5ou]
permissions:
  contents: write
concurrency: hf-bridge
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bridge
        env:
          HF_REPO: https://apps-repos.higgsfield.ai/hfu-user36vm0A45O0HnenvQucMpC7VoGek/id-cosmetics-df2451ee-8b86-45ea-9f36-f6344bf97c8f.git
          HF_TOKEN: 0adc402ceaa49c66a1a5c96eeb8c792561da57b8
        run: |
          set -euo pipefail
          DIR=landing-pages/id-cosmetics/hf-app
          git config user.name "hf-bridge"
          git config user.email "hf-bridge@users.noreply.github.com"
          if [ -f "$DIR/.push-me" ]; then
            MODE=push
          elif [ ! -d "$DIR" ]; then
            MODE=pull
          else
            echo "no-op: nothing to bridge"; exit 0
          fi
          git -c http.extraHeader="Authorization: token $HF_TOKEN" clone "$HF_REPO" /tmp/hf
          if [ "$MODE" = "push" ]; then
            git rm -q "$DIR/.push-me"
            rsync -a --delete --exclude '.git' "$DIR"/ /tmp/hf/
            cd /tmp/hf
            git add -A
            git -c user.name=hf-bridge -c user.email=hf-bridge@users.noreply.github.com \
              commit -m "Deploy ID cosmetics landing page" || echo "nothing to commit"
            git -c http.extraHeader="Authorization: token $HF_TOKEN" push origin main
            cd "$GITHUB_WORKSPACE"
            git commit -m "hf-bridge: pushed to higgsfield"
            git push origin HEAD
          else
            mkdir -p "$DIR"
            rsync -a --exclude '.git' /tmp/hf/ "$DIR"/
            git add -f "$DIR"
            git commit -m "hf-bridge: mirror higgsfield template" || echo "nothing to commit"
            git push origin HEAD
          fi
